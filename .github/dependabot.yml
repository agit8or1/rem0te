version: 2

# Security updates are enabled at the repository level and do not need this
# file. This exists for the `ignore` rules, which apply to security updates as
# well as version updates — see the esbuild entry.

updates:
  # ── JavaScript (pnpm workspace) ──────────────────────────────────────────
  # One entry for the workspace root: apps/api, apps/web and apps/launcher all
  # share the root pnpm-lock.yaml.
  #
  # Note for anyone reviewing these PRs: transitive pins live in BOTH
  # package.json (pnpm <=10) and pnpm-workspace.yaml (pnpm >=11, which is what
  # CI runs). Dependabot only knows about the first. A PR that bumps a pinned
  # transitive needs the workspace file updated by hand or it changes nothing
  # in CI. CI also rejects any lockfile entry younger than 24h
  # (minimumReleaseAge), so a freshly-published fix may need a day to land.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Listed FIRST, because a dependency joins the first group whose rules it
      # matches. `prisma` (the CLI, a devDependency) and `@prisma/client` (a
      # production dependency) must move together or neither works — and
      # grouping only by dependency-type put them in separate pull requests,
      # each carrying half a version-locked pair:
      #
      #   #20  @prisma/client 7.10.0 with prisma 5.22.0
      #        -> Cannot find module '.../generator-build/index.js'
      #   #17  prisma 7.10.0 with @prisma/client 5.22.0
      #        -> P1012, and the real blocker below
      #
      # Neither could pass, so neither could merge, so the pair sat open.
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # Do not let anything move esbuild. The usable window is narrow and no
      # automated bump lands inside it:
      #   <0.25.0          dev-server request-forgery advisory
      #   >=0.27.3 <0.28.1 Windows dev-server file-read advisory
      #   >=0.27.7         drops destructuring lowering for safari13, which the
      #                    Tauri launcher targets (macOS 10.15 WKWebView), and
      #                    fails its build — 0.27.6 ok, 0.27.7 not
      # That leaves >=0.25.0 <0.27.3, which pnpm-workspace.yaml pins by hand.
      # Revisit only when 0.28.1+ also restores the safari13 lowering.
      - dependency-name: esbuild

      # Prisma majors are a migration, not a bump, so they are not raised
      # automatically. Prisma 7 removes `url` from the schema's datasource
      # block:
      #
      #   P1012  The datasource property `url` is no longer supported in schema
      #          files. Move connection URLs for Migrate to `prisma.config.ts`
      #
      # which touches schema.prisma, the PrismaClient constructor, migrate
      # deploy, seed.ts, both _docs-demo-* scripts, the deploy steps in
      # CLAUDE.md, and the `prisma generate` run on the deploy target. Taking
      # it as a dependency update would break the API on merge.
      #
      # Minor and patch updates still arrive, grouped, via the `prisma` group
      # above. Lift this when someone is actually doing the v7 migration.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]

  # ── Tauri launcher (Rust) ────────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: "/apps/launcher/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  # ── Windows installer (Go) ───────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: "/tools/windows-installer"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  # ── CI actions ───────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
