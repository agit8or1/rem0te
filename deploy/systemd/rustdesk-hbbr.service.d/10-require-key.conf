# Require clients to present the server key on the relay as well.
#
# Locking only hbbs is not enough: hbbr listens on 21117/21119 and will happily
# relay traffic for any pair of peers that reach it, so an unlocked relay stays
# usable by strangers even when the rendezvous server rejects them.
#
# See rustdesk-hbbs.service.d/10-require-key.conf for why this is a drop-in and
# why the key is "_" rather than a literal. hbbr resolves "_" against
# id_ed25519.pub in WorkingDirectory (/var/lib/rustdesk-server), same as hbbs.
[Service]
ExecStart=
ExecStart=/usr/bin/hbbr -k _
