# Require clients to present the server key.
#
# Without -k, hbbs accepts ANY client that finds the host — including ones that
# never received our config — and a stranger's peer can register itself into
# db_v2.sqlite3. "-k _" reads the public key from id_ed25519.pub in
# WorkingDirectory (/var/lib/rustdesk-server) and rejects everything else:
#   "Authentication failed from <addr> for peer <id> - invalid key"
#
# The key must stay equal to TenantSettings.rustdeskPublicKey, which every
# generated installer and Quick Connect script embeds. Using "_" rather than a
# literal key means this file tracks id_ed25519.pub instead of becoming a third
# place the key has to be kept in sync.
#
# -r sets the default relay advertised to clients; install.sh substitutes the
# deployment domain for __DOMAIN__.
#
# This is a drop-in rather than an edit to the unit because rustdesk-hbbs.service
# can be shipped by the rustdesk-server .deb — an in-place edit is silently
# reverted on package upgrade, which would reopen registration without warning.
[Service]
ExecStart=
ExecStart=/usr/bin/hbbs -r __DOMAIN__ -k _
