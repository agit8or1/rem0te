packages:
  - 'apps/*'
  - 'packages/*'

# Security overrides for transitive dependencies carrying advisories.
#
# THIS FILE IS THE ONLY HOME FOR THEM. They used to be duplicated in
# package.json's `pnpm.overrides`, because pnpm <=10 reads that field and
# pnpm >=11 reads this one — CI ran 11, developers ran 10, and both copies were
# load-bearing in different places. Keeping two hand-maintained lists of
# security pins in sync is a bet nobody wins, so `package.json` now pins
# `packageManager: pnpm@11.x` and the mirror is gone.
#
# If you find yourself adding an override to package.json, the toolchain pin has
# been removed or bypassed — fix that instead.
#
# Note for anyone reviewing a Dependabot PR: Dependabot does not read this file.
# It cannot see, update or even mention these pins, so a PR that bumps a package
# constrained here changes nothing in the install until the range below is
# widened by hand.
overrides:
  # Scoped to the 7+ line only. The advisory covers >=7.0.0 <8.18.0, so ajv 6 is
  # unaffected — and @eslint/eslintrc pins ajv ^6.14.0, so a blanket override
  # forces an incompatible major on it and eslint dies with
  # "Cannot set properties of undefined (setting 'defaultMeta')".
  'ajv@>=7.0.0 <8.18.0': '>=8.18.0'
  'brace-expansion': '>=5.0.12'
  # Back on the 3.x line, floor raised to 3.1.9 for GHSA-333x-w4r6-6crp and
  # three sibling advisories. `>=3.1.1` was unbounded and had lifted ajv's
  # `fast-uri ^3` onto 4.1.3, which carries GHSA-qw65-cvwx-89v3 and three
  # more advisories that only exist in 4.x. 3.x is unaffected by all of them.
  'fast-uri': '>=3.1.9 <4.0.0'
  # Express's proxy trust: IPv4-mapped IPv6 addresses matched trust subnets
  # they are not in (GHSA-jqcg-44mw-7w3h). The API's TRUSTED_PROXIES depends on it.
  'proxy-addr': '>=2.0.8'
  'source-map-js': '>=1.2.2'
  'picomatch': '>=4.0.4'
  'js-yaml': '>=4.3.2'
  'nanoid': '>=5.1.7'
  'postcss': '>=8.5.23'
  'file-type': '>=21.3.1'
  'path-to-regexp': '>=8.4.0'
  'lodash': '>=4.18.1'
  'multer': '>=2.5.0'
  # Pinned into a window that clears both esbuild advisories while still
  # building the Tauri launcher, which targets safari13 (macOS 10.15 WKWebView):
  #   >=0.25.0 clears the dev-server request-forgery advisory
  #   <0.27.3  sits below the Windows dev-server file-read advisory (>=0.27.3 <0.28.1)
  #   <0.27.7  is required regardless: 0.27.7 dropped destructuring lowering for
  #            safari13 and fails the launcher build (0.27.6 ok, 0.27.7 not)
  'esbuild': '>=0.25.0 <0.27.3'
  # GHSA-3g3m-2fjr-6pw4 (AbortSignal cancellation bypass), >=9.0.0 <=14.0.1.
  # Reaches us only through @nestjs/cli (build time).
  'glob': '>=14.0.2'
  # GHSA-mrwp-f3q8-3g9p: custom credential headers followed cross-realm
  # redirects. Reaches us through the web app's axios.
  'follow-redirects': '>=1.16.2'
  'flatted': '>=3.4.2'
  'qs': '>=6.16.1'
  '@babel/core': '>=7.29.6'
  'body-parser': '>=2.4.0'
  # Unbounded cache growth -> OOM. Reaches us only through
  # @nestjs/cli > fork-ts-checker-webpack-plugin > webpack.
  'browserslist': '>=4.28.7 <4.29.0'
  # Not a security pin. electron-to-chromium publishes most days, and CI's pnpm
  # rejects any lockfile entry younger than 24h (minimumReleaseAge). browserslist
  # pulls it, so bumping browserslist drags in that day's release and fails the
  # install. Raise this freely — it is a data table of Chromium versions.
  'electron-to-chromium': '<1.5.428'
  # ReDoS. Reaches us only through tailwindcss.
  'postcss-selector-parser': '>=6.1.3'

  # Next pulls sharp for image optimization; <0.35 inherits libvips CVEs, and
  # <0.35.5 carries GHSA-wq5f-xc86-pv6w.
  'sharp': '>=0.35.5'

# Packages allowed to run install scripts. Also only here now: pnpm <=10 read
# `onlyBuiltDependencies` from package.json, pnpm >=11 reads `allowBuilds` from
# this file, and the toolchain pin settles which. argon2 and prisma compile
# native binaries; esbuild and sharp fetch platform binaries.
#
# A pnpm that ignores this list fails loudly rather than quietly — it prints
# "Ignored build scripts" and the native modules are simply absent — so a
# mis-pinned toolchain shows up as a build error, not as a silent downgrade.
allowBuilds:
  'argon2': true
  '@prisma/client': true
  '@prisma/engines': true
  'prisma': true
  '@nestjs/core': true
  'esbuild': true
  'sharp': true
  # native resolver used by eslint-config-next 15's import plugin
  'unrs-resolver': true

# Advisories accepted rather than fixed. Each one needs a reason, and an entry
# comes out the moment a patched release exists.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3, stack exhaustion on deeply nested patterns. No patched
    # release exists. It is reached only through eslint-config-next ->
    # fast-glob -> micromatch, i.e. the lint run, whose patterns are this
    # repository's own config. Not in any production install (`pnpm why braces
    # --prod` is empty).
    - GHSA-vfj7-8cjw-p6xm
    # deepmerge <=4.3.1, prototype poisoning in mergeObject(). No patched
    # release exists. Reached only through @nestjs/cli ->
    # fork-ts-checker-webpack-plugin, i.e. the build, merging that plugin's own
    # options. Not in any production install (`pnpm why deepmerge -r --prod`
    # is empty).
    - GHSA-gcqx-w48m-w2h4
    # minimatch <11.0.1, globparts amplification DoS. The only patched release
    # is 11.x and there is no backport to 3.x or 10.x. Every consumer is lint or
    # build tooling (eslint 8/9, @eslint/*, eslint plugins, typescript-estree,
    # fork-ts-checker); eslint calls minimatch 3's function export, so
    # overriding to 11 crashes `pnpm lint` (tried in 0.19.4). Patterns come from
    # this repository's own config. Not in any production install
    # (`pnpm why minimatch -r --prod` is empty).
    - GHSA-g3hv-75wg-m249
