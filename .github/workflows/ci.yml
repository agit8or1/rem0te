name: CI

# The checks that were only ever run by hand, on one machine. Every one of these
# has caught something real: check-versions exists because v0.8.0 shipped with
# apps/api still on 0.7.1, and the launcher build is here because an esbuild bump
# broke it while nothing in `pnpm build` was looking at that package.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose. The pnpm version is declared once, by
      # `packageManager` in package.json, and action-setup reads it from there.
      # Declaring it in both places is a hard error:
      #   Error: Multiple versions of pnpm specified
      #   Remove one of these versions to avoid ERR_PNPM_BAD_PM_VERSION
      - uses: pnpm/action-setup@v6

      # vite 6 requires ^20.19 || >=22.12; Next 15 requires >=18.18.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # allowBuilds in pnpm-workspace.yaml lists the packages permitted to run
      # install scripts (argon2 and prisma compile native binaries; esbuild,
      # sharp and unrs-resolver fetch platform ones). Without them pnpm exits
      # non-zero and every later `pnpm exec` fails before it starts.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Every version string must agree and the release must be written down.
      - name: Versions and changelog
        run: node scripts/check-versions.mjs

      # Protections that failed silently once already: a rate-limit decorator
      # naming a throttler that is not configured, a pre-MFA token accepted as a
      # session, the device heartbeat trusting a RustDesk ID, an unrestricted
      # fail2ban-client sudo grant, the launcher trusting a link's API address,
      # read-test-write on single-use tokens. None of them threw, logged, or
      # failed a test — which is exactly why they are checked by grep.
      - name: Security invariants
        run: node scripts/check-security-invariants.mjs

      # tsc cannot resolve @prisma/client's generated types until this has run,
      # so it has to come before the typecheck rather than with the build.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Behavioural, not static: runs the compiled session services against an
      # in-memory Prisma double, so it needs no database. The invariant checks
      # above passed while the 0.19.12 session-mutation bugs were live.
      - name: Session mutation tests
        run: node apps/api/scripts/unit-session-mutations.mjs

      # Contract ticket-rmm-v1: the JSON Schemas ClientSt0r validates against are
      # generated from the runtime zod schemas; drift between them, or a fixture
      # that no longer parses, fails here. Then the signing, trust-file and
      # analysis rules, against the compiled code with no database.
      - name: Integration contract and unit tests
        run: |
          node scripts/gen-integration-contracts.mjs --check
          node apps/api/scripts/unit-integration.mjs

      # Technician presets and the launch policy (0.23): every branch of
      # evaluateLaunch against the compiled code, with in-memory stand-ins.
      - name: Presets and launch-policy unit tests
        run: node apps/api/scripts/unit-presets.mjs

      # The two Windows installer variants (0.24): static checks on the signed
      # one, and — with the runner's pwsh — a parse of both plus execution of
      # the signed parameter block against hostile parameter files.
      - name: Signed installer tests
        run: node apps/api/scripts/unit-signed-installer.mjs

      # The approval signer (0.26), standalone: synthetic ES256 passkeys through
      # the real WebAuthn verification — origin, RP ID, user verification,
      # challenge reuse, counter regression, quorum, customer sign-off — and a
      # check that its standalone install still loads no Nest or Prisma.
      - name: Approval signer tests
        run: |
          node apps/api/scripts/unit-approval-signer.mjs
          node apps/api/scripts/build-approval-signer.mjs --list

      # Patch policies (0.32): the pure policy evaluator the signer runs before
      # signing a ring plan under an approved policy — every refusal, the
      # maintenance-window arithmetic across DST, the shared ring gate — and
      # the signer's policy records (quorum, tamper, revocation).
      - name: Patch policy tests
        run: node apps/api/scripts/unit-patch-policy.mjs

      # The tamper-evident audit chain (0.28): every tamper kind, gaps,
      # checkpoint signatures and the export checker, against the compiled
      # chain module with no database.
      - name: Audit chain tests
        run: node apps/api/scripts/unit-audit-chain.mjs

      # Monitoring (0.29): rule inheritance, evaluators, outage correlation,
      # escalation timing, the inventory diff and the report sanitisers against
      # the compiled engine — and, with the runner's pwsh, the agent's monitor
      # block executed against stubbed Get-Service / Get-WinEvent.
      - name: Monitoring tests
        run: node apps/api/scripts/unit-monitoring.mjs

      # Diagnostics catalog (0.31): the closed catalog, result sanitising,
      # redaction and the size cap against the compiled module, the agent's
      # dispatch switch against the catalog — and, with the runner's pwsh, both
      # installers parsed and the diagnostics block run against stub cmdlets.
      - name: Diagnostics catalog tests
        run: node apps/api/scripts/unit-diagnostics-catalog.mjs

      # System inventory snapshots (0.33): the process / service / adapter
      # sanitisers, row and byte bounds, and the build-time guard on the
      # heartbeat's snapshot block (each refusal proven by mutation) — and,
      # with the runner's pwsh, the three keys run against stub cmdlets.
      - name: System inventory tests
        run: node apps/api/scripts/unit-system-inventory.mjs

      # Scheduled client updates (0.32): the update window's validation, time
      # zones (+5:30, +5:45, a 30-minute DST zone), windows across midnight,
      # both DST transitions, next opening/closing against a minute-by-minute
      # reference, and the policy decisions the sweep and heartbeat share.
      - name: Client update window tests
        run: node apps/api/scripts/unit-update-window.mjs

      # Script library: content and definition hashing, content and parameter
      # validation, the contributor rule behind SAME_PERSON, the line diff,
      # and every static-check rule (they warn, never block) against the
      # compiled module with no database.
      - name: Script library tests
        run: node apps/api/scripts/unit-script-library.mjs

      # Running approved scripts (0.34): the typed argument rule (the same
      # table as the agent's Go test), the plan rule the portal and the signer
      # share, the catalog entry, and the portal's second redaction and cap
      # of reported output. No database, no signer.
      - name: Script run tests
        run: node apps/api/scripts/unit-script-run.mjs

      # Patch status (0.30): the Patches tab summary and the redacted ticket
      # summary for restart required/completed, failed, offline/stale, WSUS and
      # Intune, the standard agent and no evidence, against the contract schema.
      - name: Patch summary tests
        run: node apps/api/scripts/unit-patch-summary.mjs

      # Global search (0.33): q is 2–100 visible characters, LIKE metacharacters
      # are literal, the ranking, and which capability gates each group.
      - name: Global search tests
        run: node apps/api/scripts/unit-search.mjs

      # The macOS agent (0.33): its awk date conversions (it avoids date(1),
      # whose BSD and GNU forms differ) against JavaScript over 2,000 instants
      # in every shell on the runner, the RecommendedUpdates parser, the
      # read-only platform mapping, and both POSIX agents parsed by sh, dash,
      # bash --posix and busybox sh.
      - name: macOS agent tests
        run: node apps/api/scripts/unit-macos-agent.mjs

      # The panel updater's release-tag check (0.30.1): real gpg keys and a
      # real signed tag, one keyring holding the release key AND another, so
      # the pinned check is tested against exactly the case it exists for.
      - name: Updater signature tests
        run: node apps/api/scripts/unit-update-signing.mjs

      # Device groups, saved views and bulk actions (0.33): a view's filters
      # are the list's own parameters (unknown keys and bad values refused),
      # an update applies no defaults, who may manage a business's groups and
      # shared views, the 200 cap and the four actions, the fleet budget that
      # stops short of the abuse guard, and per-computer refusal reasons.
      - name: Device views tests
        run: node apps/api/scripts/unit-device-views.mjs

      # Rule-based device groups (0.34): a rule is the list's own closed
      # filters — round-trip, refusal of unknown and refused keys and of any
      # value the list refuses, an unreadable rule matching nothing, numeric
      # version comparison, and bulk's endpointIds XOR targetGroupId.
      - name: Dynamic group tests
        run: node apps/api/scripts/unit-dynamic-groups.mjs

      # Metric history (0.33): samples from heartbeat values, the hourly
      # roll-up, which hours a pass rolls, retention caps and gap detection.
      - name: Metric history tests
        run: node apps/api/scripts/unit-metric-history.mjs

      # Data retention (0.34): defaults, floors and ceilings of every
      # RETENTION_* variable, the cutoffs, the per-pass cap and batch loop,
      # report coverage, and the table inventory (the audit chain is evidence).
      - name: Data retention tests
        run: node apps/api/scripts/unit-retention.mjs
      # The shared hbbs peer snapshot (0.34): never used past its window,
      # measured from the start of its read; a failed read answers null and
      # never an older snapshot; the window clamp; the digits-only query
      # against a real scratch sqlite database (sqlite3 is on the runner).
      - name: hbbs peer snapshot tests
        run: node apps/api/scripts/unit-hbbs-peer-snapshot.mjs

      # `pnpm typecheck` and `pnpm build` cover api and web only. The launcher is
      # built separately here because it is the package that broke last, and it
      # targets safari13, which is what makes it sensitive to esbuild bumps.
      - name: Typecheck and build launcher
        run: |
          pnpm --filter @reboot-remote/launcher exec tsc --noEmit
          pnpm --filter @reboot-remote/launcher build

  # The end-to-end suites, against a disposable Postgres. Until 0.30.1 these
  # ran only by hand while .github/SECURITY.md said CI ran them. Each suite
  # starts the compiled API itself (or scripts/run-e2e.sh starts one per
  # suite) against this job's throwaway database, migrated and seeded fresh.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rem0te
          POSTGRES_PASSWORD: rem0te-ci-only
          POSTGRES_DB: rem0te_e2e_scratch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rem0te" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://rem0te:rem0te-ci-only@127.0.0.1:5432/rem0te_e2e_scratch
    steps:
      - uses: actions/checkout@v7
      # No `version:` — declared once, by `packageManager` (see the check job).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/windows-installer/go.mod
          cache-dependency-path: tools/windows-installer/go.sum
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and build the API
        run: |
          pnpm db:generate
          pnpm --filter @reboot-remote/api build
      # The release tool and the agent's decision code, for the suites that
      # drive them (approved actions, staged patching, containment, signed updates).
      - name: Build release tool and action simulator
        working-directory: tools/windows-installer
        run: |
          go build -o "$RUNNER_TEMP/rem0te-release" ./cmd/rem0te-release
          go build -o "$RUNNER_TEMP/rem0te-action-sim" ./cmd/rem0te-action-sim
          echo "RELEASE_BIN=$RUNNER_TEMP/rem0te-release" >> "$GITHUB_ENV"
          echo "ACTION_SIM=$RUNNER_TEMP/rem0te-action-sim" >> "$GITHUB_ENV"
      - name: End-to-end suites
        run: scripts/run-e2e.sh
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: .e2e-logs/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No `version:` here on purpose. The pnpm version is declared once, by
      # `packageManager` in package.json, and action-setup reads it from there.
      # Declaring it in both places is a hard error:
      #   Error: Multiple versions of pnpm specified
      #   Remove one of these versions to avoid ERR_PNPM_BAD_PM_VERSION
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The tree reached zero advisories in 0.11.0. This is what keeps it there.
      - name: Audit
        run: pnpm audit

  # The Windows installer, cross-compiled.
  #
  # This was unverified by anything until now, which is how a
  # golang.org/x/sys 0.18 -> 0.48 bump came to sit open with a green check
  # beside it: the check was real, it simply never compiled the module the PR
  # changed. `main.go` imports golang.org/x/sys/windows directly, so nothing
  # about that bump was being tested.
  #
  # GOOS=windows because that is the only target this binary is ever built for;
  # the syscall package it uses does not exist on Linux and the build fails
  # there for reasons that have nothing to do with the change under test.
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No `version:` — the toolchain is declared once, by the `go` directive
      # in tools/windows-installer/go.mod, the same way pnpm's is by
      # packageManager.
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/windows-installer/go.mod
          cache-dependency-path: tools/windows-installer/go.sum
      # The signed update chain (0.24): release tooling, the go-tuf client and
      # the agent's install/update/migrate flow, including the attack drills —
      # tampered target, forged targets, rollback, freeze, mix-and-match,
      # stolen timestamp key, root rotation, downgrade, relay repointing.
      # And the approved-action verifier (0.26): every refusal, replay after
      # restart, interruption mid-action, and the at-most-once journal.
      # And windows.script.run (0.34): every refusal, and — with the runner's
      # pwsh (PowerShell 7, not Windows PowerShell 5.1) — arguments passed as
      # data, the timeout killing the process tree, and the output cap.
      - name: Signed update chain and approved-action tests
        working-directory: tools/windows-installer
        run: go test ./...
      - name: Build for Windows
        working-directory: tools/windows-installer
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -v ./...
          go vet ./...
