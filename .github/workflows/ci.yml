name: CI

# The checks that were only ever run by hand, on one machine. Every one of these
# has caught something real: check-versions exists because v0.8.0 shipped with
# apps/api still on 0.7.1, and the launcher build is here because an esbuild bump
# broke it while nothing in `pnpm build` was looking at that package.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose. The pnpm version is declared once, by
      # `packageManager` in package.json, and action-setup reads it from there.
      # Declaring it in both places is a hard error:
      #   Error: Multiple versions of pnpm specified
      #   Remove one of these versions to avoid ERR_PNPM_BAD_PM_VERSION
      - uses: pnpm/action-setup@v6

      # vite 6 requires ^20.19 || >=22.12; Next 15 requires >=18.18.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # allowBuilds in pnpm-workspace.yaml lists the packages permitted to run
      # install scripts (argon2 and prisma compile native binaries; esbuild,
      # sharp and unrs-resolver fetch platform ones). Without them pnpm exits
      # non-zero and every later `pnpm exec` fails before it starts.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Every version string must agree and the release must be written down.
      - name: Versions and changelog
        run: node scripts/check-versions.mjs

      # Protections that failed silently once already: a rate-limit decorator
      # naming a throttler that is not configured, a pre-MFA token accepted as a
      # session, the device heartbeat trusting a RustDesk ID, an unrestricted
      # fail2ban-client sudo grant, the launcher trusting a link's API address,
      # read-test-write on single-use tokens. None of them threw, logged, or
      # failed a test — which is exactly why they are checked by grep.
      - name: Security invariants
        run: node scripts/check-security-invariants.mjs

      # tsc cannot resolve @prisma/client's generated types until this has run,
      # so it has to come before the typecheck rather than with the build.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Behavioural, not static: runs the compiled session services against an
      # in-memory Prisma double, so it needs no database. The invariant checks
      # above passed while the 0.19.12 session-mutation bugs were live.
      - name: Session mutation tests
        run: node apps/api/scripts/unit-session-mutations.mjs

      # The device page's Tools panel (0.75): every tool in every state it can
      # reach, the order the states are decided in, who may request an action
      # (mirroring AccessPolicyService), and that every action, diagnostics key
      # and tab it names exists. Pure TypeScript, transpiled; no build needed.
      - name: Device Tools tests
        run: node apps/web/scripts/unit-device-tools.mjs

      # Contract ticket-rmm-v1: the JSON Schemas ClientSt0r validates against are
      # generated from the runtime zod schemas; drift between them, or a fixture
      # that no longer parses, fails here. Then the signing, trust-file and
      # analysis rules, against the compiled code with no database.
      - name: Integration contract and unit tests
        run: |
          node scripts/gen-integration-contracts.mjs --check
          node apps/api/scripts/unit-integration.mjs

      # Technician presets and the launch policy (0.23): every branch of
      # evaluateLaunch against the compiled code, with in-memory stand-ins.
      - name: Presets and launch-policy unit tests
        run: node apps/api/scripts/unit-presets.mjs

      # The two Windows installer variants (0.24): static checks on the signed
      # one, and — with the runner's pwsh — a parse of both plus execution of
      # the signed parameter block against hostile parameter files.
      - name: Signed installer tests
        run: node apps/api/scripts/unit-signed-installer.mjs

      # The approval signer (0.26), standalone: synthetic ES256 passkeys through
      # the real WebAuthn verification — origin, RP ID, user verification,
      # challenge reuse, counter regression, quorum, customer sign-off — and a
      # check that its standalone install still loads no Nest or Prisma.
      - name: Approval signer tests
        run: |
          node apps/api/scripts/unit-approval-signer.mjs
          node apps/api/scripts/build-approval-signer.mjs --list

      # Patch policies (0.32): the pure policy evaluator the signer runs before
      # signing a ring plan under an approved policy — every refusal, the
      # maintenance-window arithmetic across DST, the shared ring gate — and
      # the signer's policy records (quorum, tamper, revocation).
      - name: Patch policy tests
        run: node apps/api/scripts/unit-patch-policy.mjs
      # 0.53: monthly maintenance windows — the closed window union, the nth
      # and last weekday with an offset into the next month, a day of the
      # month, midnight at month end and DST in both hemispheres, expiry
      # (window_never_opens), the signer signing inside and refusing outside,
      # unknown kinds refused, and a weekly document's digest pinned to 0.52's.
      - name: Monthly patch window tests
        run: node apps/api/scripts/unit-monthly-window.mjs
      # 0.54: restart scheduling and restart windows — the two closed restart
      # flags (onlyIfRequired, the RustDesk-session exception), a policy's
      # restart window and rule, the signer's restart-plan evaluation (inside
      # the window, the fixed warning, the exception only when the policy has
      # it, one open plan and three per window), and the 0.52 digest pinned.
      - name: Restart window tests
        run: node apps/api/scripts/unit-restart-windows.mjs
      # 0.55: alert conditions and automatic PSA tickets — every fixed drive
      # (charset-checked letters, one alert each), uptime, outstanding and
      # failed updates, the recommended set, the auto-ticket rule (every
      # reason it does not ticket), its retry schedule and the draft it sends.
      - name: Alert condition tests
        run: node apps/api/scripts/unit-alert-conditions.mjs
      # 0.57: device adoption — the unassigned rule, deployment keys (96 hex,
      # hash only, 90 days / 10,000 uses, review by default) and assignment
      # rules (four kinds, none about users; ranking and conflicts).
      - name: Device adoption tests
        run: node apps/api/scripts/unit-adoption.mjs
      # 0.58: automation schedules — hourly recurrence (beside, never inside,
      # the patch window union), the offline rule as the signed notAfter, the
      # document and its quorum, every evaluateAutomationPlan refusal, and the
      # signer in-process: approval, occurrence plans, no overlap, revocation,
      # pause, direct mode and the CLI.
      - name: Automation schedule tests
        run: node apps/api/scripts/unit-automation-schedule.mjs
      # 0.60: restart windows — the restart task in the automation document,
      # every evaluateAutomationRestart refusal and the per-computer ledger,
      # precedence (computer > group > business), when a restart is asked
      # again, and the signer's approval page.
      - name: Restart window tests
        run: node apps/api/scripts/unit-restart-window-settings.mjs
      # 0.50: company-wide and assignable patch policies — the rings the
      # portal builds (checked with the signer's own validatePolicyDoc), the
      # membership fingerprint and the bounded revision decision.
      - name: Patch policy assignment tests
        run: node apps/api/scripts/unit-patch-assignment.mjs

      # The tamper-evident audit chain (0.28): every tamper kind, gaps,
      # checkpoint signatures and the export checker, against the compiled
      # chain module with no database.
      - name: Audit chain tests
        run: node apps/api/scripts/unit-audit-chain.mjs

      # Monitoring (0.29): rule inheritance, evaluators, outage correlation,
      # escalation timing, the inventory diff and the report sanitisers against
      # the compiled engine — and, with the runner's pwsh, the agent's monitor
      # block executed against stubbed Get-Service / Get-WinEvent.
      - name: Monitoring tests
        run: node apps/api/scripts/unit-monitoring.mjs
      # 0.66: alert classification — the exact DS-HOME1 event and other
      # shadow-copy numbers, every condition of the known-benign pattern,
      # genuine disk, controller, SMART and NTFS events, informational events,
      # backup and Security-log monitors never lowered, fingerprints, the
      # corrected recommended monitor and the plain-English explanation.
      - name: Alert classification tests
        run: node apps/api/scripts/unit-alert-classification.mjs

      # Alert quality rules (0.67): narrowness, risk, expiry, scope (never
      # across a business), shadow rules counted but never applied,
      # precedence and conflicts, the unseen-event floor, simulation and its
      # dangerous matches, recommendations and the monitoring-quality checks.
      - name: Alert quality rule tests
        run: node apps/api/scripts/unit-alert-quality-rules.mjs

      # Managed Secure Access readiness (0.69): the heartbeat block's parser
      # (closed keys and values, cli agreeing with the keys, nothing that is
      # not the installed exe) and the readiness decision — every rule, and
      # 1,244,160 combinations of facts with no managed fact and no managed
      # state among them (0.72: the managed states only from a managed fact).
      - name: MSA readiness tests
        run: node apps/api/scripts/unit-msa-readiness.mjs

      # Managed Secure Access grants (0.71): the switch's exactness, the grant
      # document's canonical form and signature, and the shared fixture —
      # rebuilt and compared with the file, then every case asserted exactly
      # as the Go verifier's tests assert it (internal/msa/grant).
      - name: MSA grant tests
        run: node apps/api/scripts/unit-msa-grants.mjs

      # Managed Secure Access enforcement (0.72): the vocabulary the portal and
      # the agent share (keys, outcomes, events, the view-only ceiling), the
      # rotation hold, the strict report body, and the grant-key target's one
      # name and schema across the portal, the agent and the release host.
      - name: MSA managed tests
        run: node apps/api/scripts/unit-msa-managed.mjs

      # Managed Secure Access sessions (0.73): the signed revocation against
      # the shared fixture the Go verifier also asserts, the Connect grant
      # terms over every combination of policy facts (never above the
      # ceiling), and the session timeline (Launched is never Connected).
      - name: MSA session tests
        run: node apps/api/scripts/unit-msa-sessions.mjs

      # Admin → Security (0.74): every host parser (sshd config with includes,
      # ufw, ss, apt, fail2ban, Caddyfile, certificate dates, headers, npm
      # audit) against fixtures, the closed command list against the sudoers
      # lines the installer grants, the score and the off-switch list.
      - name: Server security tests
        run: node apps/api/scripts/unit-host-security.mjs

      # Diagnostics catalog (0.31): the closed catalog, result sanitising,
      # redaction and the size cap against the compiled module, the agent's
      # dispatch switch against the catalog — and, with the runner's pwsh, both
      # installers parsed and the diagnostics block run against stub cmdlets.
      - name: Diagnostics catalog tests
        run: node apps/api/scripts/unit-diagnostics-catalog.mjs

      # Read-only diagnostics palette (0.76): the thirteen checks' catalog
      # entries, the typed-parameter schema (one host-name rule in the portal,
      # the agent and the database), every sanitizer against hostile input,
      # every interpretation threshold, the OS end-of-servicing table, the
      # build-time palette guard (each refusal proven by mutation) — and, with
      # the runner's pwsh, every key run against stub cmdlets in a desktop and
      # a Server world with no secret reaching a post.
      - name: Diagnostics palette tests
        run: node apps/api/scripts/unit-diagnostics-palette.mjs

      # System inventory snapshots (0.33): the process / service / adapter
      # sanitisers, row and byte bounds, and the build-time guard on the
      # heartbeat's snapshot block (each refusal proven by mutation) — and,
      # with the runner's pwsh, the three keys run against stub cmdlets.
      - name: System inventory tests
        run: node apps/api/scripts/unit-system-inventory.mjs

      # Automatic snapshots (0.35): who can be asked, when a key is due (the
      # schedule, the watched interval, the failure back-off), what the tab is
      # told, the Settings validation, the fleet-wide pacer, and the stored
      # size of a typical snapshot from the real sanitiser.
      - name: Automatic snapshot tests
        run: node apps/api/scripts/unit-snapshot-schedule.mjs

      # Automatic agent self-update (0.36): which agent has which update path,
      # what it updates to, which policy's mode governs, and decide() — the
      # opt-outs, holds, attempt window, back-off, cap and failing state — and,
      # with the runner's pwsh, both Windows installers and heartbeats parsed
      # and the signed heartbeat's periodic self-check run against a stub
      # agent; the Linux and macOS agents through sh -n.
      - name: Agent auto-update tests
        run: node apps/api/scripts/unit-agent-auto-update.mjs

      # Which agent a computer runs is sticky to signed (0.51, §64): the rule,
      # every report shape (signed heartbeat, standard heartbeat, the
      # installers' own check-ins), the Agent card's warning, and with the
      # runner's pwsh the scripts parsed and the standard heartbeat's hand-over
      # run against a stub agent.
      - name: Agent identity tests
        run: node apps/api/scripts/unit-agent-identity.mjs

      # What the console shows as an agent's version (0.69.1): a signed agent
      # on the published build shows the published release, whatever label it
      # last recorded; and automatic update's isBehind / decide are unchanged.
      - name: Agent version display tests
        run: node apps/api/scripts/unit-agent-version-view.mjs

      # Automatic migration to the signed agent (0.37): settings and what
      # widens, the gate, the canary/soak state machine (confirmed only on the
      # published build; halted on a failure, a cancel, a missing computer or
      # a timeout), canary ordering, the pace budget and the hold mapping.
      - name: Automatic migration tests
        run: node apps/api/scripts/unit-auto-migration.mjs

      # Scheduled client updates (0.32): the update window's validation, time
      # zones (+5:30, +5:45, a 30-minute DST zone), windows across midnight,
      # both DST transitions, next opening/closing against a minute-by-minute
      # reference, and the policy decisions the sweep and heartbeat share.
      - name: Client update window tests
        run: node apps/api/scripts/unit-update-window.mjs

      # Script library: content and definition hashing, content and parameter
      # validation, the contributor rule behind SAME_PERSON, the line diff,
      # and every static-check rule (they warn, never block) against the
      # compiled module with no database.
      - name: Script library tests
        run: node apps/api/scripts/unit-script-library.mjs

      # Running approved scripts (0.34): the typed argument rule (the same
      # table as the agent's Go test), the plan rule the portal and the signer
      # share, the catalog entry, and the portal's second redaction and cap
      # of reported output. No database, no signer.
      - name: Script run tests
        run: node apps/api/scripts/unit-script-run.mjs

      # Patch status (0.30): the Patches tab summary and the redacted ticket
      # summary for restart required/completed, failed, offline/stale, WSUS and
      # Intune, the standard agent and no evidence, against the contract schema.
      - name: Patch summary tests
        run: node apps/api/scripts/unit-patch-summary.mjs

      # Task progress (0.52): the lifecycle every task view is built from —
      # queued, scheduled, held, handed out, overdue, done with each update's
      # result — replayed against DEWEY-WKS2022's real timeline, and the
      # schedule that becomes a plan's signed notBefore.
      - name: Task progress tests
        run: node apps/api/scripts/unit-task-progress.mjs

      # Global search (0.33): q is 2–100 visible characters, LIKE metacharacters
      # are literal, the ranking, and which capability gates each group.
      - name: Global search tests
        run: node apps/api/scripts/unit-search.mjs

      # The macOS agent (0.33): its awk date conversions (it avoids date(1),
      # whose BSD and GNU forms differ) against JavaScript over 2,000 instants
      # in every shell on the runner, the RecommendedUpdates parser, the
      # read-only platform mapping, and both POSIX agents parsed by sh, dash,
      # bash --posix and busybox sh.
      - name: macOS agent tests
        run: node apps/api/scripts/unit-macos-agent.mjs

      # The panel updater's release-tag check (0.30.1): real gpg keys and a
      # real signed tag, one keyring holding the release key AND another, so
      # the pinned check is tested against exactly the case it exists for.
      - name: Updater signature tests
        run: node apps/api/scripts/unit-update-signing.mjs

      # Device groups, saved views and bulk actions (0.33): a view's filters
      # are the list's own parameters (unknown keys and bad values refused),
      # an update applies no defaults, who may manage a business's groups and
      # shared views, the 200 cap and the four actions, the fleet budget that
      # stops short of the abuse guard, and per-computer refusal reasons.
      - name: Device views tests
        run: node apps/api/scripts/unit-device-views.mjs

      # Rule-based device groups (0.34): a rule is the list's own closed
      # filters — round-trip, refusal of unknown and refused keys and of any
      # value the list refuses, an unreadable rule matching nothing, numeric
      # version comparison, and bulk's endpointIds XOR targetGroupId.
      - name: Dynamic group tests
        run: node apps/api/scripts/unit-dynamic-groups.mjs

      # Group-scoped policies (0.35): computer > group > site > business >
      # global for monitors and client updates, two groups decided by
      # priority (1 first) in every row order, membership changes dropping a
      # group policy, and what beat what reported.
      - name: Group policy tests
        run: node apps/api/scripts/unit-group-policy.mjs

      # Polish (0.35): connectivity's three states — online inside the
      # heartbeat window, agent_silent when reachable through RustDesk without
      # one, offline — with the API and web copies agreeing; restart and update
      # wording by platform; black-or-white ink on any branding accent at
      # 4.5:1 or better across 4096 colours.
      - name: Polish tests
        run: node apps/api/scripts/unit-polish.mjs

      # Metric history (0.33): samples from heartbeat values, the hourly
      # roll-up, which hours a pass rolls, retention caps and gap detection.
      - name: Metric history tests
        run: node apps/api/scripts/unit-metric-history.mjs

      # Data retention (0.34): defaults, floors and ceilings of every
      # RETENTION_* variable, the cutoffs, the per-pass cap and batch loop,
      # report coverage, and the table inventory (the audit chain is evidence).
      - name: Data retention tests
        run: node apps/api/scripts/unit-retention.mjs

      # The shared hbbs peer snapshot (0.34): never used past its window,
      # measured from the start of its read; a failed read answers null and
      # never an older snapshot; the window clamp; the digits-only query
      # against a real scratch sqlite database (sqlite3 is on the runner).
      - name: hbbs peer snapshot tests
        run: node apps/api/scripts/unit-hbbs-peer-snapshot.mjs

      # Software deployment (0.34): the closed install/uninstall params and
      # their charsets (package id, version, hash, the three detection forms),
      # version comparison as the agent does it, compliance from evidence with
      # the 14-day staleness rule, the winget-pkgs manifest reader and
      # installer choice, the ring gate, and that WINGET_MANIFEST_BASE is
      # honoured only for a loopback http URL.
      - name: Software deployment tests
        run: node apps/api/scripts/unit-software.mjs

      # Service control and ending a process (0.45): the closed parameters and
      # charsets, the protected lists and refusal rules against the agent's Go
      # source, the request DTOs (nothing but the row, the op and a window),
      # and that a stored process_list row is a valid plan parameter as it is.
      - name: Service and process control tests
        run: node apps/api/scripts/unit-service-process.mjs

      # Settings → Confirm it is you (0.49, replaces 0.47's routine confirm):
      # the catalog, a key set 'off' skips the step-up and nothing else ever
      # does (always-ask, unknown and unread all ask), and the policy
      # service's admin / always-ask / relax-needs-fresh / audit rules.
      - name: Confirm policy tests
        run: node apps/api/scripts/unit-confirm-policy.mjs

      # The background terminal (0.77): the open decision's order, the two
      # shells, the idle and hard limits (and that nothing but the
      # technician's input moves the idle clock), who may end a session, the
      # frame and session caps, and that the limits agree with the agent's Go
      # constants.
      - name: Terminal tests
        run: node apps/api/scripts/unit-terminal.mjs

      # Background file transfer (0.78): the path rule against the fixture
      # the agent's Go tests share, the limits and error codes agreeing with
      # the agent and 0095, the request decision's order, the clocks, chunk
      # checks, the platform-only capabilities, files.transfer off by
      # default, and the browser's SHA-256 against node:crypto.
      - name: File transfer tests
        run: node apps/api/scripts/unit-files.mjs

      # Rollback and repeatability per catalog action (0.79, §89): every one
      # of the twelve declares both, the portal agrees with the fixture the
      # agent's Go test reads, the catalog route and the job view serve them,
      # the docs table says the same, and the per-computer tally and the
      # console's words for it.
      - name: Rollback and repeatability tests
        run: node apps/api/scripts/unit-action-rollback.mjs

      # Mobile devices (0.80): the MDM command state machine (provider
      # acceptance is not device completion), the provider record schemas
      # (closed lists, no IMEI, no BYOD serial), the closed lists against
      # 0096's CHECKs, the stand-in test-only and loopback-only, and
      # mobile:view off by default.
      - name: Mobile device (MDM) tests
        run: node apps/api/scripts/unit-mdm.mjs

      # Agit8or Identity P0 (0.59): the decisions made from an identity
      # provider's claims (levels from acr corroborated by amr, the
      # organization gate, Platform Admin, step-up freshness, back-channel
      # logout claims, enforcement), the phishing-resistant method set and the
      # separation of session, integration and IdP tokens.
      - name: SSO identity tests
        run: node apps/api/scripts/unit-sso-identity.mjs

      # AI summary through ClientSt0r (0.34): redaction of every free-text field
      # before it leaves, the payload's field list, the proposed request and
      # response schemas, and the peers file's optional capabilitiesUrl.
      - name: AI summary tests
        run: node apps/api/scripts/unit-ai-timeline.mjs

      # Ask AI and PSA tickets (0.48): the redactor on realistic Windows
      # events, each provider's request shape, the typed-URL rule, field
      # encryption, the ticket draft and the webhook HMAC.
      - name: AI provider and PSA ticket tests
        run: node apps/api/scripts/unit-ai-psa.mjs

      # Hardware warranty (0.56): manufacturer normalisation, virtual-machine
      # detection, every vendor's support links (the serial in a URL only for
      # Dell, checked and encoded), the warranty buckets, the Dell and Lenovo
      # response parsers against loopback stubs, and the sweep budget.
      - name: Warranty tests
        run: node apps/api/scripts/unit-warranty.mjs

      # Warranty vendors (0.61): HP's token, one-serial job, bounded polling
      # and results; Apple's ES256 client assertion, token and AppleCare
      # coverage; the "why is there no date" reasons — against a loopback
      # stand-in only, never a real vendor.
      - name: Warranty vendor tests
        run: node apps/api/scripts/unit-warranty-vendors.mjs

      # Backups (0.81): the strict feed, restore tests derived only from real
      # drills of a job's own recovery point, asset state and RPO/RTO, the four
      # opt-in monitor kinds, the push token, and the backup-agent templates.
      - name: Backup tests
        run: node apps/api/scripts/unit-backups.mjs

      # Settings → Backups and the St0r push contract (0.82): every example in
      # docs/st0r-push-contract.md against the API's own zod schema, the JSON
      # Schema file regenerated and compared byte for byte, idempotency (a
      # fact never moves backwards), rotation, the push address and the four
      # capability states.
      - name: Backup setup and St0r contract tests
        run: node apps/api/scripts/unit-backup-setup.mjs

      # Settings → Mobile devices (0.83): the push CSR, matching a certificate
      # to its key, the topic, expiry, the vendor-signed PushCertRequest, the
      # Google service-account key's shape, reminders and the topic rule —
      # all against stand-in keys and certificates made at run time.
      - name: MDM setup tests
        run: node apps/api/scripts/unit-mdm-setup.mjs

      # Rem0te's own Apple MDM (0.84): plist parsing and its refusals, the
      # detached Mdm-Signature (openssl-made, every refusal, BER), the signed
      # enrollment profile (AccessRights without erase, no PKCS#12, SCEP only
      # under test), check-in and report reading (no UnlockToken, no IMEI), the
      # APNs body and status mapping, and the driver's records through the
      # sync's own parsers. Stand-in certificates made at run time.
      - name: Own Apple MDM tests
        run: node apps/api/scripts/unit-mdm-apple.mjs
      # 0.85 (§94): Rem0te as the EMM for Android — the default policy, the
      # service-account JWT, Device and Operation mapping (a personal device's
      # serial dropped), escaping, 0102's CHECKs, and the client against an
      # in-process loopback stand-in in AMAPI's shape. Never reaches Google.
      - name: Android EMM tests
        run: node apps/api/scripts/unit-mdm-android.mjs
      # 0.86 (§95): lost-device commands — the three kinds, the request's
      # checks, which device can take what (Apple lost mode only supervised,
      # Android lost mode never personal), the Apple and Android bodies, both
      # drivers' send() (Android against an in-process loopback stand-in),
      # and 0103's CHECKs. Never reaches Apple or Google.
      - name: Lost-device command tests
        run: node apps/api/scripts/unit-mdm-lost-device.mjs

      # Outbound email (0.34): the SMTP host rule (every address class, IPv4-
      # mapped IPv6, what SMTP_ALLOW_LOCAL_RELAY admits, every resolved address
      # checked), the report schedule maths across zones and both DST
      # transitions — weekly occurrences against the update window's own next
      # opening — and what an alert or report email may say.
      - name: Email tests
        run: node apps/api/scripts/unit-email.mjs

      # Agent upgrade (0.34): each precondition for moving a computer to the
      # signed agent and its order, the Signed-only boundary, request states,
      # the migration script's digest pin and staging directory, and (pwsh is
      # on the runner) the heartbeat's agent-status block run against fixtures.
      - name: Agent migration tests
        run: node apps/api/scripts/unit-agent-migration.mjs

      # Signed releases on one host (0.37): the helpers behind the single-host
      # release tooling — a RustDesk build needs GitHub's published digest and
      # URL, unverified metadata is charset-checked before a shell sees it, and
      # pruning keeps the newest two targets versions. (The tooling itself is
      # never run by CI against anything real; its e2e suite runs in a temp dir.)
      - name: Signed release helper tests
        run: node apps/api/scripts/unit-signed-release.mjs

      # Chat (0.34): message text and the controls it drops, reported names,
      # which computers can chat and why not, presence and receipts, device
      # ids, and the retention window and its bounds.
      - name: Chat tests
        run: node apps/api/scripts/unit-chat.mjs

      # Agent health (0.36): the opt-in agent-silent monitor's bounds, raise /
      # hold / clear and alert text; re-resolving a queued automatic client
      # update (keep, adopt, re-plan, withdraw, and why).
      - name: Agent health tests
        run: node apps/api/scripts/unit-agent-health.mjs

      # The tray (0.36): one-time chat codes and the /assist cookie, the
      # page's CSP and that its script never builds HTML, tray keys, recorded
      # or not, the self-help catalog (equal to the agent's and the
      # migration's), screenshots and usage samples, and which computers can
      # chat through the tray.
      - name: Tray tests
        run: node apps/api/scripts/unit-tray.mjs

      # The Windows Installer package (0.65, §77): real .msi builds with wixl
      # and msibuild, read back with msiinfo and msiextract. The runner image
      # has no msitools; without them the suite fails under CI rather than
      # skipping.
      - name: Windows Installer package tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wixl msitools
          node apps/api/scripts/unit-windows-msi.mjs

      # `pnpm typecheck` and `pnpm build` cover api and web only. The launcher is
      # built separately here because it is the package that broke last, and it
      # targets safari13, which is what makes it sensitive to esbuild bumps.
      - name: Typecheck and build launcher
        run: |
          pnpm --filter @reboot-remote/launcher exec tsc --noEmit
          pnpm --filter @reboot-remote/launcher build

  # The end-to-end suites, against a disposable Postgres. Until 0.30.1 these
  # ran only by hand while .github/SECURITY.md said CI ran them. Each suite
  # starts the compiled API itself (or scripts/run-e2e.sh starts one per
  # suite) against this job's throwaway database, migrated and seeded fresh.
  e2e:
    runs-on: ubuntu-latest
    # 60 until 0.34; the browser suite adds a web build and about five minutes.
    timeout-minutes: 80
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rem0te
          POSTGRES_PASSWORD: rem0te-ci-only
          POSTGRES_DB: rem0te_e2e_scratch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rem0te" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://rem0te:rem0te-ci-only@127.0.0.1:5432/rem0te_e2e_scratch
    steps:
      - uses: actions/checkout@v7
      # No `version:` — declared once, by `packageManager` (see the check job).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/windows-installer/go.mod
          cache-dependency-path: tools/windows-installer/go.sum
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and build the API
        run: |
          pnpm db:generate
          pnpm --filter @reboot-remote/api build
      # The release tool and the agent's decision code, for the suites that
      # drive them (approved actions, staged patching, containment, signed updates).
      - name: Build release tool and action simulator
        working-directory: tools/windows-installer
        run: |
          go build -o "$RUNNER_TEMP/rem0te-release" ./cmd/rem0te-release
          go build -o "$RUNNER_TEMP/rem0te-action-sim" ./cmd/rem0te-action-sim
          go build -o "$RUNNER_TEMP/rem0te-remote-sim" ./cmd/rem0te-remote-sim
          echo "RELEASE_BIN=$RUNNER_TEMP/rem0te-release" >> "$GITHUB_ENV"
          echo "ACTION_SIM=$RUNNER_TEMP/rem0te-action-sim" >> "$GITHUB_ENV"
          echo "REMOTE_SIM=$RUNNER_TEMP/rem0te-remote-sim" >> "$GITHUB_ENV"
      # The own Apple MDM suite (0.84): mdmb, a simulated iPhone (MIT), pinned
      # by commit, and step-ca v0.30.2, pinned by the release tarball's SHA-256
      # (the same pin as deploy/mdm-ca/rem0te-mdm-ca-setup.sh).
      - name: Build mdmb and fetch step-ca
        run: |
          GOBIN="$RUNNER_TEMP/gobin" go install github.com/jessepeterson/mdmb/cmd/mdmb@7adfa11f66cf3a56cd89ba5a70677d37143be1b1
          echo "MDMB_BIN=$RUNNER_TEMP/gobin/mdmb" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/step-ca"
          curl -fsSL --proto =https -o "$RUNNER_TEMP/step-ca.tar.gz" https://github.com/smallstep/certificates/releases/download/v0.30.2/step-ca_linux_amd64.tar.gz
          echo "1726ee7b6a24c67abb8c9e96ad671623b29b3d34f6a712f7087495f31331e54b  $RUNNER_TEMP/step-ca.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/step-ca.tar.gz" -C "$RUNNER_TEMP/step-ca"
          echo "STEP_CA_BIN=$(find "$RUNNER_TEMP/step-ca" -type f -name step-ca | head -1)" >> "$GITHUB_ENV"
      # e2e-add-device downloads real .msi packages (0.65) and reads them
      # back with msiinfo; under CI it fails without msitools.
      - name: Install msitools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wixl msitools
      - name: End-to-end suites
        run: scripts/run-e2e.sh
      # The console in a real browser (0.34). Until now nothing in CI opened a
      # page: the navigation and search-palette suites needed the docs stack
      # and ran by hand, and several 0.32/0.33 pages had never been rendered by
      # any test. e2e-ui.mjs starts its own API and a patched copy of this web
      # build on 3501/3502 against this job's database, seeds and removes its
      # own fixtures, and fails on any console error at desktop and 375 px, in
      # both themes. It runs even when an API suite failed, so one red suite
      # does not hide the state of the other.
      - name: Build the web app
        if: ${{ !cancelled() }}
        run: pnpm --filter @reboot-remote/web build
      # The headless shell is what chromium.launch() runs headless; --with-deps
      # adds the system libraries the runner image does not ship.
      - name: Install the browser
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: npx playwright install --with-deps chromium-headless-shell
      - name: UI suite (browser)
        id: ui
        if: ${{ !cancelled() }}
        # Every port the suite listens on, stated (0.35): web and API, the
        # loopback SMTP sink (Email settings) and the reference ClientSt0r peer
        # (the History tab's AI summary). The suite's own API runs with every
        # background sweep off, STALE_SWEEP, SNAPSHOT_SWEEP and AGENT_AUTO_UPDATE included (set
        # in e2e-ui.mjs, checked by the invariants).
        env:
          OUT_DIR: ${{ runner.temp }}/ui-screenshots
          UI_WEB_PORT: '3501'
          UI_API_PORT: '3502'
          UI_SMTP_PORT: '3503'
          UI_PEER_PORT: '3504'
        run: node apps/web/scripts/e2e-ui.mjs
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            .e2e-logs/
            ${{ runner.temp }}/ui-screenshots/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No `version:` here on purpose. The pnpm version is declared once, by
      # `packageManager` in package.json, and action-setup reads it from there.
      # Declaring it in both places is a hard error:
      #   Error: Multiple versions of pnpm specified
      #   Remove one of these versions to avoid ERR_PNPM_BAD_PM_VERSION
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The tree reached zero advisories in 0.11.0. This is what keeps it there.
      - name: Audit
        run: pnpm audit

  # 0.56: the agent's Go tests on real Windows and macOS (owner's decision,
  # 2026-11-16). The Linux job above runs them on ubuntu; this runs the same
  # `go test ./...` on GitHub's hosted Windows and macOS runners, so path,
  # reparse-point, service and launchd code meets a real OS before it meets a
  # customer's computer. No keys, no signing and no release scripts here (§56):
  # it builds nothing that is published. Not a required check while the macOS
  # side has no platform code of its own yet; a red macOS run is a finding,
  # not a merge block.
  # Older released signed agents against this server (0.68.2, docs/compatibility.md).
  # One leg per tag in scripts/compat/supported-agents.json: the agent's decision
  # code is built from that tag exactly as released and driven through this
  # checkout's action suites. Simulator evidence, not real Windows.
  compat-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.list.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "tags=$(node -e 'console.log(JSON.stringify(require("./scripts/compat/supported-agents.json").signedAgents.map((a) => a.tag)))')" >> "$GITHUB_OUTPUT"

  compat-agents:
    needs: compat-matrix
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.compat-matrix.outputs.tags) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rem0te
          POSTGRES_PASSWORD: rem0te-ci-only
          POSTGRES_DB: rem0te_compat_scratch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rem0te" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://rem0te:rem0te-ci-only@127.0.0.1:5432/rem0te_compat_scratch
    name: compat (agent ${{ matrix.tag }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/windows-installer/go.mod
          cache-dependency-path: tools/windows-installer/go.sum
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and build the API
        run: |
          pnpm db:generate
          pnpm --filter @reboot-remote/api build
      - name: Agent ${{ matrix.tag }} against this server
        env:
          COMPAT_OUT: ${{ runner.temp }}/compat
        run: scripts/compat-agents.sh "${{ matrix.tag }}"
      - name: Evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: compat-evidence-${{ matrix.tag }}
          path: ${{ runner.temp }}/compat/${{ matrix.tag }}/evidence.json
          if-no-files-found: warn

  # Older released standard agents' wire bodies against this server (0.73.1,
  # docs/compatibility.md). One leg per agent in scripts/compat/wire/agents.json:
  # every release's captured heartbeat, enrolment and result bodies, replayed
  # against this checkout's API with the answers read the way that release
  # reads them. The fixtures are committed; capturing them (pwsh, git tags) is
  # scripts/compat/capture-wire.mjs, run when a release is added. Wire
  # evidence, not real Windows, Linux or macOS. Not a required check: the
  # owner's call once it has run stably.
  compat-wire:
    strategy:
      fail-fast: false
      matrix:
        agent: [windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rem0te
          POSTGRES_PASSWORD: rem0te-ci-only
          POSTGRES_DB: rem0te_wire_scratch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rem0te" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://rem0te:rem0te-ci-only@127.0.0.1:5432/rem0te_wire_scratch
    name: compat-wire (${{ matrix.agent }})
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and build the API
        run: |
          pnpm db:generate
          pnpm --filter @reboot-remote/api build
      - name: ${{ matrix.agent }} standard agents' wire bodies against this server
        env:
          COMPAT_OUT: ${{ runner.temp }}/compat
        run: scripts/compat-wire.sh "${{ matrix.agent }}"
      - name: Evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: compat-wire-evidence-${{ matrix.agent }}
          path: ${{ runner.temp }}/compat/wire/evidence.json
          if-no-files-found: warn

  agent-real-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/windows-installer/go.mod
          cache-dependency-path: tools/windows-installer/go.sum
      - name: Agent tests on ${{ matrix.os }}
        working-directory: tools/windows-installer
        run: go test ./...

  # The Windows installer, cross-compiled.
  #
  # This was unverified by anything until now, which is how a
  # golang.org/x/sys 0.18 -> 0.48 bump came to sit open with a green check
  # beside it: the check was real, it simply never compiled the module the PR
  # changed. `main.go` imports golang.org/x/sys/windows directly, so nothing
  # about that bump was being tested.
  #
  # GOOS=windows because that is the only target this binary is ever built for;
  # the syscall package it uses does not exist on Linux and the build fails
  # there for reasons that have nothing to do with the change under test.
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No `version:` — the toolchain is declared once, by the `go` directive
      # in tools/windows-installer/go.mod, the same way pnpm's is by
      # packageManager.
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/windows-installer/go.mod
          cache-dependency-path: tools/windows-installer/go.sum
      # The signed update chain (0.24): release tooling, the go-tuf client and
      # the agent's install/update/migrate flow, including the attack drills —
      # tampered target, forged targets, rollback, freeze, mix-and-match,
      # stolen timestamp key, root rotation, downgrade, relay repointing.
      # And the approved-action verifier (0.26): every refusal, replay after
      # restart, interruption mid-action, and the at-most-once journal.
      # And windows.script.run (0.34): every refusal, and — with the runner's
      # pwsh (PowerShell 7, not Windows PowerShell 5.1) — arguments passed as
      # data, the timeout killing the process tree, and the output cap.
      # And the tray (0.36, replacing the 0.34 chat host and window): pipe
      # frames and their size and field limits, the hello nonce, the closed
      # self-help catalog (compared with the portal's and the migration's),
      # local rate limits, the one-time chat link and the window's navigation
      # rule, the device secret never reaching the tray, a tray key never
      # running an elevated tool, offline runs, and the signed tray install.
      - name: Signed update chain and approved-action tests
        working-directory: tools/windows-installer
        run: go test ./...
      # The tray icons (0.51) are generated: the committed .ico files must be
      # what the script in the repository draws.
      - name: Tray icons match their generator
        run: node tools/windows-installer/cmd/rem0te-tray/icons/gen-icons.mjs --check
      - name: Build for Windows
        working-directory: tools/windows-installer
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -v ./...
          go vet ./...
