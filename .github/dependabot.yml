version: 2

# Security updates are enabled at the repository level and do not need this
# file. This exists for the `ignore` rules, which apply to security updates as
# well as version updates — see the esbuild entry.

updates:
  # ── JavaScript (pnpm workspace) ──────────────────────────────────────────
  # One entry for the workspace root: apps/api, apps/web and apps/launcher all
  # share the root pnpm-lock.yaml.
  #
  # Note for anyone reviewing these PRs: transitive pins live ONLY in
  # pnpm-workspace.yaml now, and Dependabot does not read that file. It cannot
  # see those pins, so a PR that bumps a package constrained there changes
  # nothing in the install until the range is widened by hand — and the PR will
  # look like it did something. (Until 0.18.8 the pins were mirrored in
  # package.json, which Dependabot does read; the mirror is gone because two
  # hand-maintained copies of a security pin list is a bet nobody wins.)
  # CI also rejects any lockfile entry younger than 24h (minimumReleaseAge), so
  # a freshly-published fix may need a day to land.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # Weekly, deliberately, and it pairs with the release policy in
      # CLAUDE.md: a devDependency-only merge does not get its own release, it
      # folds into the next one. Without that policy a weekly interval means a
      # weekly branch-PR-CI-tag-release-restart cycle to record a change that
      # cannot reach production; with it, the PRs arrive weekly and the
      # releases stay tied to things that actually ship.
      #
      # The groups below are what make the cadence tolerable: one PR for
      # production, one for development, one for the prisma pair — not one per
      # package.
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Listed FIRST, because a dependency joins the first group whose rules it
      # matches. `prisma` (the CLI, a devDependency) and `@prisma/client` (a
      # production dependency) must move together or neither works — and
      # grouping only by dependency-type put them in separate pull requests,
      # each carrying half a version-locked pair:
      #
      #   #20  @prisma/client 7.10.0 with prisma 5.22.0
      #        -> Cannot find module '.../generator-build/index.js'
      #   #17  prisma 7.10.0 with @prisma/client 5.22.0
      #        -> P1012, and the real blocker below
      #
      # Neither could pass, so neither could merge, so the pair sat open.
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # Do not let anything move esbuild. The usable window is narrow and no
      # automated bump lands inside it:
      #   <0.25.0          dev-server request-forgery advisory
      #   >=0.27.3 <0.28.1 Windows dev-server file-read advisory
      #   >=0.27.7         drops destructuring lowering for safari13, which the
      #                    Tauri launcher targets (macOS 10.15 WKWebView), and
      #                    fails its build — 0.27.6 ok, 0.27.7 not
      # That leaves >=0.25.0 <0.27.3, which pnpm-workspace.yaml pins by hand.
      # Revisit only when 0.28.1+ also restores the safari13 lowering.
      - dependency-name: esbuild

      # Prisma majors are a migration, not a bump, so they are not raised
      # automatically. Prisma 7 removes `url` from the schema's datasource
      # block:
      #
      #   P1012  The datasource property `url` is no longer supported in schema
      #          files. Move connection URLs for Migrate to `prisma.config.ts`
      #
      # which touches schema.prisma, the PrismaClient constructor, migrate
      # deploy, seed.ts, both _docs-demo-* scripts, the deploy steps in
      # CLAUDE.md, and the `prisma generate` run on the deploy target. Taking
      # it as a dependency update would break the API on merge.
      #
      # Minor and patch updates still arrive, grouped, via the `prisma` group
      # above. Lift this when someone is actually doing the v7 migration.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]

      # otplib majors. 13.x removes the `authenticator` named export:
      #
      #   src/mfa/mfa.service.ts(3,10): error TS2305
      #   Module '"otplib"' has no exported member 'authenticator'
      #
      # Five call sites in mfa.service.ts — generateSecret, keyuri and three
      # verify() — so this is a rewrite of the TOTP path, which is the second
      # factor for every account. Getting it subtly wrong either locks people
      # out or weakens 2FA while still appearing to work, and nothing in CI
      # would notice the latter.
      #
      # Left grouped it also blocked 31 unrelated production updates, because a
      # grouped PR is only as mergeable as its worst member.
      - dependency-name: "otplib"
        update-types: ["version-update:semver-major"]

      # NestJS majors. Reverted once already, in v0.18.13, after a grouped PR
      # took seven of the eight @nestjs/* packages to 12 and left
      # @nestjs/throttler on ^6.5.0 — whose peer range stops at NestJS 11.
      #
      # pnpm installed that tree anyway (it is lenient about peers), CI compiled
      # it and all three checks went green. npm at the deploy target refused
      # outright with ERESOLVE, which is the only reason anyone found out:
      #
      #   peer @nestjs/core@"^7 || ^8 || ^9 || ^10 || ^11" from
      #   @nestjs/throttler@6.5.0
      #
      # The throttler is the rate limiter on login, MFA verify, enrollment,
      # grant redemption and the event-log routes. A rate limiter that quietly
      # stops limiting is the exact failure check-security-invariants.mjs
      # exists for, so "compiles and probably fine" is not the bar.
      #
      # This is NOT blocked upstream: @nestjs/throttler 6.6.0 added ^12.0.0 to
      # its peer range. Lifting this means bumping throttler to ^6.6.0 or later
      # FIRST, then doing the framework upgrade deliberately — with a runtime
      # check that the limits still fire, not just a build that succeeds.
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]

      # TypeScript majors. TS 7 arrived in the development group and took lint
      # down across the whole workspace: typescript-eslint refuses to load
      # against it —
      #
      #   Error: typescript-eslint does not support TS 7.0.
      #   ESLint: 10.10.0
      #
      # — and its latest stable still peers `typescript >=4.8.4 <6.1.0`, with
      # everything past 8.70.0 an alpha. So this is genuinely blocked upstream,
      # not sequencing: nothing we can pin here makes eslint run on TS 7.
      #
      # Lift it when typescript-eslint ships a stable release whose typescript
      # peer range admits 7 — tracked at
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940.
      # Note that TS 6 is the intermediate step Microsoft documents for running
      # side by side, so the move may well be 5 -> 6 first.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      # The lint toolchain majors. These arrived together in the development
      # group (#34) and each one breaks lint on its own — tested in both
      # directions rather than guessed at:
      #
      #   eslint 10 + eslint-config-next 15  ->  Cannot read config file:
      #                                          eslint-config-next/index.js
      #   eslint  9 + eslint-config-next 16  ->  TypeError: Converting circular
      #                                          structure to JSON
      #   eslint 10 + eslint-config-next 16  ->  same circular structure
      #
      # eslint 10 dropped the legacy eslintrc format that eslint-config-next 15
      # still publishes, and 16 reaches the flat config through FlatCompat in a
      # shape eslint's own error formatter cannot even serialize. The API lints
      # fine on eslint 10 — it has no Next config — but Dependabot ignores are
      # per dependency name, not per workspace, and running two eslint majors
      # across one monorepo to satisfy that is worse than waiting.
      #
      # Lifting this is a deliberate piece of work, not a version bump: move
      # apps/web/eslint.config.mjs off FlatCompat onto whatever flat config
      # eslint-config-next 16 exports natively, then take both majors together.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]

      # Tailwind majors. Tailwind 4 is a rewrite, not a version bump: the
      # PostCSS plugin moved to its own package, so the CSS build stops dead —
      #
      #   It looks like you're trying to use `tailwindcss` directly as a
      #   PostCSS plugin. The PostCSS plugin has moved to a separate package
      #
      # — and configuration moves from tailwind.config.ts into CSS `@theme`.
      # Lifting this means installing @tailwindcss/postcss, rewriting
      # postcss.config.js, and porting the theme; the dark-mode tokens and the
      # gauge colour thresholds all live in that config, so it wants its own
      # release with the screenshots recaptured.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # ── Tauri launcher (Rust) ────────────────────────────────────────────────
  #
  # Nothing in CI compiles this. The "Typecheck and build launcher" job builds
  # the launcher's TypeScript; the Rust in src-tauri is only ever built when
  # someone produces an installer locally. So a green check on a cargo PR says
  # nothing whatsoever about whether the crate still compiles.
  #
  # Minor and patch updates still come through on that basis — they are
  # low-risk and the next local build catches a mistake. Majors do not:
  # reqwest 0.12 -> 0.13 touches the one HTTP client the launcher uses, with
  # default-features off and rustls-tls selected by hand, and merging it blind
  # would leave a broken installer build to be discovered at release time by
  # whoever is trying to ship.
  #
  # Lift this when CI builds the Rust side (it needs a Rust toolchain and the
  # webkit2gtk system libraries), and do the upgrade with a toolchain in hand.
  - package-ecosystem: cargo
    directory: "/apps/launcher/src-tauri"
    schedule:
      # Tuesday, so it does not pile onto Monday with the npm batch. Note what
      # weekly means for this one specifically: nothing in CI compiles the Rust
      # side, so these arrive with a green check that proves only that the
      # launcher's TypeScript still builds. Read them as unverified until CI
      # grows a Rust toolchain — the same trap the gomod entry was in until
      # 0.18.11.
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "reqwest"
        update-types: ["version-update:semver-major"]

  # ── Windows installer (Go) ───────────────────────────────────────────────
  # Verified by the `installer` job in ci.yml, which cross-compiles this for
  # Windows. It was unverified until 0.18.11, which is why a golang.org/x/sys
  # bump sat open with a green check that proved nothing.
  - package-ecosystem: gomod
    directory: "/tools/windows-installer"
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3

  # ── CI actions ───────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 3
